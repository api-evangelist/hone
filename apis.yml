aid: hone
name: Hone
description: 'Hone is an employee development platform that combines live, expert-led virtual workshops
  with AI-powered coaching to drive behavior change and continuous learning across an organization. Founded
  in 2018 and headquartered in San Francisco and New York City, Hone delivers 100+ live classes, AI lessons
  and roleplays, 1:1 and group coaching, and on-demand membership learning focused on leadership, management,
  and people skills. The platform integrates with major HRIS and LMS systems to sync learners and report on
  program impact, and has reached millions of employees across 58+ countries. Backed by F-Prime Capital,
  Cowboy Ventures, Slack Fund, and others. Hone does not currently publish a public developer API.'
